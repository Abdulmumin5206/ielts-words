<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twin Words</title>
<meta name="description" content="IELTS Reading vocabulary: important words from the next tests, with Turkish, twins and spaced practice.">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Twin Words">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f6f7f5; --card:#ffffff; --ink:#1c2321; --soft:#5b6663; --line:#e1e5e3;
  --acc:#0f766e; --acc2:#e6f4f1; --ok:#15803d; --okbg:#e8f6ec; --bad:#b42318; --badbg:#fdecea;
  --warn:#9a6700; --warnbg:#fff6dd; --chip:#eef1f0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --card:#1b201e; --ink:#e8ecea; --soft:#9aa5a1; --line:#2c3431;
    --acc:#2dd4bf; --acc2:#163a35; --ok:#4ade80; --okbg:#173322; --bad:#f87171; --badbg:#3a1d1b;
    --warn:#facc15; --warnbg:#3a3214; --chip:#252c29;
  }
}
:root[data-theme="dark"]{
  --bg:#121614; --card:#1b201e; --ink:#e8ecea; --soft:#9aa5a1; --line:#2c3431;
  --acc:#2dd4bf; --acc2:#163a35; --ok:#4ade80; --okbg:#173322; --bad:#f87171; --badbg:#3a1d1b;
  --warn:#facc15; --warnbg:#3a3214; --chip:#252c29;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 24px)}
#app{max-width:560px;margin:0 auto}
h1{font-size:24px;margin:6px 0 2px}
h2{font-size:18px;margin:0 0 8px}
.sub{color:var(--soft);font-size:15px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--acc);color:#fff;font-family:inherit;font-weight:600;font-size:18px;line-height:1.15;padding:16px;margin-top:10px;cursor:pointer}
:root[data-theme="dark"] .btn:not(.ghost){color:#062d29}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn:not(.ghost){color:#062d29} }
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.small{display:inline-block;width:auto;padding:10px 14px;font-size:15px;margin:6px 6px 0 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.icon{border:0;background:var(--chip);color:var(--ink);border-radius:12px;font-size:18px;padding:10px 12px;cursor:pointer;min-width:46px}
.big{font-size:34px;font-weight:700;letter-spacing:.2px;margin:4px 0;word-break:break-word}
.pos{color:var(--soft);font-size:15px;font-style:italic}
.use{color:var(--acc);font-size:15px;margin-top:2px}
.lab{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--soft);margin:12px 0 3px}
.tr{font-size:18px}
.chips span{display:inline-block;background:var(--acc2);color:var(--ink);border-radius:999px;padding:5px 11px;margin:3px 4px 0 0;font-size:15px}
.ex{font-size:18px;background:var(--chip);border-radius:12px;padding:10px 12px;margin-top:4px}
.ex b{color:var(--acc)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px;margin-top:10px;font-family:inherit;font-size:17px;line-height:1.35;cursor:pointer}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{opacity:1}
.q{font-size:15px;color:var(--soft);margin-bottom:4px}
.prompt{font-size:22px;font-weight:600;margin:6px 0}
.fb{border-radius:12px;padding:12px;margin-top:12px;font-size:16px}
.fb.ok{background:var(--okbg)} .fb.bad{background:var(--badbg)} .fb.warn{background:var(--warnbg)}
input.type{width:100%;font-family:inherit;font-size:22px;line-height:1.2;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-top:12px}
input.type:focus{outline:none;border-color:var(--acc)}
.hint{font-family:ui-monospace,Menlo,monospace;font-size:20px;letter-spacing:3px;margin-top:8px}
.bar{height:10px;background:var(--chip);border-radius:999px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.prog{display:flex;justify-content:space-between;font-size:14px;color:var(--soft);margin:2px 0 6px}
.pk{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;margin-top:8px;font-family:inherit;font-size:16px;line-height:1.3;cursor:pointer}
.pk.cur{border:2px solid var(--acc)}
.pk small{color:var(--soft)}
.stat{display:flex;gap:10px}
.stat div{flex:1;background:var(--chip);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:24px}
.stat span{font-size:13px;color:var(--soft)}
.list .it{border-top:1px solid var(--line);padding:10px 2px}
.list .it:first-child{border-top:0}
.list .hd{display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer}
.list .hd b{font-size:18px}
.list .more{margin-top:6px}
.dim{opacity:.55}
.tag{font-size:12px;border-radius:999px;padding:2px 8px;background:var(--chip);color:var(--soft);white-space:nowrap}
.tag.k{background:var(--okbg);color:var(--ok)} .tag.l{background:var(--acc2);color:var(--acc)} .tag.h{background:var(--badbg);color:var(--bad)}
.note{font-size:14px;color:var(--soft)}
.search{width:100%;font-family:inherit;font-size:17px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.install{background:var(--warnbg);border-radius:14px;padding:12px 14px;font-size:15px;margin:10px 0}
.topbar{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--soft);margin:4px 0 6px}
.done-big{font-size:44px;text-align:center;margin:6px 0}
</style>
</head>
<body>
<div id="app"><p class="sub">Loading...</p></div>
<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
